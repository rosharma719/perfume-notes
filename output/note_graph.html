const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function focus(set){N.attr("opacity",d=>!set||set.has(d.id)?1:.08);T.attr("opacity",d=>!set||set.has(d.id)?1:.05);L.attr("stroke-opacity",d=>!set?.25:(set.has(d.source.id)&&set.has(d.target.id)?.8:.03))}
N.on("click",(e,d)=>{const nb=links.filter(l=>l.source.id==d.id||l.target.id==d.id).sort((a,b)=>b.weight-a.weight);
 focus(new Set([d.id,...nb.flatMap(l=>[l.source.id,l.target.id])]));
 info.innerHTML=`<b>${esc(d.id)}</b><br>${d.count} perfumes · ${esc(d.family)}<br><br>Top linked notes:<ul>`+nb.slice(0,15).map(l=>{const o=l.source.id==d.id?l.target.id:l.source.id;return `<li>${esc(o)} — ${l.weight}</li>`}).join("")+"</ul>"});
L.on("click",(e,l)=>{focus(new Set([l.source.id,l.target.id]));info.innerHTML=`<b>${esc(l.source.id)} + ${esc(l.target.id)}</b><br>${l.weight} shared perfumes (PMI ${l.pmi})<br><br>Examples:<ul>`+l.examples.map(x=>`<li>${esc(x)}</li>`).join("")+"</ul>"});
svg.on("dblclick.reset",()=>{focus(null);info.textContent="Nothing selected."});
document.getElementById("q").oninput=e=>{const v=e.target.value.toLowerCase();focus(v?new Set(nodes.filter(n=>n.id.toLowerCase().includes(v)).map(n=>n.id)):null)};
const lg=d3.select("#legend").selectAll("div").data(D.families).join("div").attr("class","leg").html(f=>`<i style="background:${col(f)}"></i>${f}`).on("click",function(e,f){off.has(f)?off.delete(f):off.add(f);d3.select(this).classed("off",off.has(f));N.attr("display",d=>off.has(d.family)?"none":null);T.attr("display",d=>off.has(d.family)?"none":null);L.attr("display",l=>off.has(l.source.family)||off.has(l.target.family)?"none":null)});
</script></body></html>
